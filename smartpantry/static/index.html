<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPantry — SmartCart</title>
<style>
  :root {
    --ink: #1a1d1a;
    --muted: #4c554c;
    --line: #dfe3dd;
    --paper: #ffffff;
    --wash: #eef1ec;
    --accent: #1e7e34;
    --accent-dark: #155d27;
    --warn: #9a6700;
    --bad: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--wash);
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header.top { margin: 4px 0 16px; }
  header.top h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  header.top h1 span { color: var(--accent); }
  header.top p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  section {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { flex: 1 1 140px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="date"] {
    width: 100%; min-height: 44px; padding: 8px 10px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
    background: #fff;
  }
  input[type="file"] { font-size: 15px; max-width: 100%; }
  button {
    min-height: 44px; padding: 10px 18px; font-size: 16px; font-weight: 600;
    border-radius: 6px; border: 1px solid transparent; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:active { background: var(--accent-dark); }
  button.ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  button:disabled { opacity: 0.55; cursor: wait; }
  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  #status { font-size: 14px; color: var(--muted); min-height: 22px; margin-top: 10px; }
  #status.error { color: var(--bad); }
  .hidden { display: none; }
  .score { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .score .big { font-size: 30px; font-weight: 700; }
  .score .big.save { color: var(--accent); }
  .score .sub { color: var(--muted); font-size: 14px; }
  ul.results { list-style: none; margin: 12px 0 0; padding: 0; }
  ul.results li {
    padding: 10px 0; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
  }
  ul.results li:first-child { border-top: 0; }
  .item-name { font-weight: 600; }
  .item-detail { font-size: 14px; color: var(--muted); }
  .pill {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; white-space: nowrap; margin-left: 8px;
  }
  .pill.buy { background: #e3f2e7; color: var(--accent-dark); }
  .pill.switch { background: #fff4d6; color: var(--warn); }
  .pill.wait { background: #f1e4e2; color: var(--bad); }
  .money { text-align: right; white-space: nowrap; }
  .money .save { color: var(--accent); font-weight: 700; }
  .money .cost { color: var(--muted); }
  ul.notes { margin: 12px 0 0; padding-left: 20px; font-size: 14px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 480px) {
    header.top h1 { font-size: 22px; }
    .actions button { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Smart<span>Scan</span></h1>
    <p>SmartCart: snap a receipt, see this week's deals.</p>
  </header>

  <section aria-label="Upload receipts">
    <h2>1 · Receipts</h2>
    <div class="row">
      <div class="field">
        <label for="files">Receipt files (.txt, .json, photos, PDF)</label>
        <input id="files" type="file" multiple
               accept=".txt,.json,.jpg,.jpeg,.png,.pdf,image/*">
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field">
        <label for="camera">Or snap one now (phone camera)</label>
        <input id="camera" type="file" accept="image/*" capture="environment">
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field">
        <label for="date">Date (used when the filename has none)</label>
        <input id="date" type="text" value="2026-11-03">
      </div>
      <div class="field">
        <label for="store">Store (used when the filename has none)</label>
        <input id="store" type="text" value="Mariano's">
      </div>
    </div>
    <div class="actions">
      <button id="scan" class="primary" type="button">Scan receipts</button>
      <button id="demo" class="ghost" type="button">Load demo receipts</button>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section id="resultsCard" class="hidden" aria-label="Results">
    <h2>2 · SmartCart</h2>
    <div class="score">
      <div class="big save" id="saving">$0.00</div>
      <div class="sub" id="totals"></div>
    </div>
    <ul class="results" id="rows"></ul>
    <ul class="notes" id="notes"></ul>
  </section>

  <section id="cartCard" class="hidden" aria-label="Draft cart">
    <h2>3 · Draft cart</h2>
    <p id="cartText" style="margin:0 0 10px"></p>
    <div class="actions">
      <button id="approve" class="primary" type="button">Approve cart</button>
      <button id="decline" class="ghost" type="button">Decline</button>
    </div>
    <div id="cartStatus" role="status" style="margin-top:10px;font-size:14px"></div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var scanBtn = document.getElementById("scan");
  var statusEl = document.getElementById("status");
  var resultsCard = document.getElementById("resultsCard");
  var cartCard = document.getElementById("cartCard");
  var approvalId = null;

  function money(n) {
    if (n === null || n === undefined) return "—";
    return "$" + Number(n).toFixed(2);
  }
  function pill(decision) {
    var label = decision.replace("_", " ");
    var cls = decision === "buy_now" ? "buy"
      : decision === "switch_store" ? "switch" : "wait";
    return '<span class="pill ' + cls + '">' + label + "</span>";
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c];
    });
  }

  scanBtn.addEventListener("click", function () {
    var picked = Array.prototype.slice.call(
      document.getElementById("files").files);
    var snapped = document.getElementById("camera").files;
    if (snapped.length) picked.push(snapped[0]);
    if (!picked.length) {
      statusEl.textContent = "Choose at least one receipt file first.";
      statusEl.className = "error";
      return;
    }
    var form = new FormData();
    picked.forEach(function (f) { form.append("receipts", f, f.name); });
    var date = encodeURIComponent(document.getElementById("date").value);
    var store = encodeURIComponent(document.getElementById("store").value);
    statusEl.textContent = "Scanning " + picked.length + " file(s)…";
    statusEl.className = "";
    scanBtn.disabled = true;
    fetch("/api/ingest?date=" + date + "&store=" + store,
          {method: "POST", body: form})
      .then(function (r) { return r.json().then(function (j) {
        return {ok: r.ok, body: j};
      }); })
      .then(function (res) {
        scanBtn.disabled = false;
        if (!res.ok || res.body.error) {
          statusEl.textContent = "Error: " + (res.body.error || res.status);
          statusEl.className = "error";
          return;
        }
        render(res.body);
      })
      .catch(function (err) {
        scanBtn.disabled = false;
        statusEl.textContent = "Error: " + err.message;
        statusEl.className = "error";
      });
  });

  document.getElementById("demo").addEventListener("click", function () {
    var btn = this;
    statusEl.textContent = "Loading demo receipts…";
    statusEl.className = "";
    btn.disabled = true;
    fetch("/api/demo", {method: "POST"})
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        if (data.error) {
          statusEl.textContent = "Error: " + data.error;
          statusEl.className = "error";
          return;
        }
        render(data);
      })
      .catch(function (err) {
        btn.disabled = false;
        statusEl.textContent = "Error: " + err.message;
        statusEl.className = "error";
      });
  });

  function render(data) {
    statusEl.textContent = data.purchases + " item(s) read, " +
      data.review + " queued for review.";
    statusEl.className = "";
    var totals = data.totals || {total: 0, saving: 0};
    document.getElementById("saving").textContent = money(totals.saving);
    document.getElementById("totals").textContent =
      "deal total " + money(totals.total);
    var rows = document.getElementById("rows");
    rows.innerHTML = "";
    (data.rows || []).forEach(function (r) {
      var li = document.createElement("li");
      var save = r.saving === null ? ""
        : '<div class="' + (r.saving > 0 ? "save" : "cost") + '">' +
          (r.saving > 0 ? "save " + money(r.saving) : money(r.saving)) +
          "</div>";
      li.innerHTML =
        '<div><span class="item-name">' + esc(r.name) + "</span>" +
        pill(r.decision) +
        '<div class="item-detail">You paid ' + money(r.paid) +
        " · deal " + money(r.deal) + " @ " + esc(r.store) + "</div></div>" +
        '<div class="money">' + save + "</div>";
      rows.appendChild(li);
    });
    if (!(data.rows || []).length) {
      rows.innerHTML = "<li><div class='item-detail'>" +
        "No priced items yet — add another receipt so items recur.</div></li>";
    }
    var notes = document.getElementById("notes");
    notes.innerHTML = "";
    (data.notes || []).forEach(function (n) {
      var li = document.createElement("li");
      li.textContent = n;
      notes.appendChild(li);
    });
    resultsCard.classList.remove("hidden");
    approvalId = data.approval_id || null;
    if (approvalId) {
      document.getElementById("cartText").textContent =
        "Draft cart totals " + money(totals.total) +
        ". Nothing is ordered until you approve.";
      document.getElementById("cartStatus").textContent = "";
      cartCard.classList.remove("hidden");
    } else {
      cartCard.classList.add("hidden");
    }
  }

  function decide(approved) {
    if (!approvalId) return;
    fetch("/api/approve", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({approval_id: approvalId, approved: approved})
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        document.getElementById("cartStatus").textContent =
          j.error ? "Error: " + j.error : "Cart " + j.status + ".";
      })
      .catch(function (err) {
        document.getElementById("cartStatus").textContent =
          "Error: " + err.message;
      });
  }
  document.getElementById("approve").addEventListener("click", function () {
    decide(true);
  });
  document.getElementById("decline").addEventListener("click", function () {
    decide(false);
  });
})();
</script>
</body>
</html>
