[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpantry"
version = "0.1.0"
description = "Personal cross-store grocery price agent (A.G.E.N.T loop)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["smartpantry", "smartpantry.*"]
exclude = ["eval", "eval.*", "tests", "tests.*"]

[tool.setuptools]
include-package-data = true