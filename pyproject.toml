
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpantry"
version = "0.2.0"
description = "Camp Creek Market - Local Atlanta shopping deals marketplace"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["smartpantry", "smartpantry.*"]
exclude = ["eval", "eval.*", "tests", "tests.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
smartpantry = [
    "static/*",
    "static/**/*",
    "data/*",
    "data/**/*",
    "fixtures/*",
    "fixtures/**/*",
    "*.json"
]
